lifecycle_manager:
  ros__parameters:
    startup_timeout: 5  # seconds for each lifecycle transition at startup
planner:
  ros__parameters:
    plan_solver_timeout: 15.0
    plan_solver_plugins: ["KAIROS"]
    KAIROS:
      plugin: "plansys2/KairosPlanSolver"
      # In a process of its own: a crash or a hang of Kairos does not take down PlanSys2
      # isolated: true
    POPF:
      plugin: "plansys2/POPFPlanSolver"
    # TFD, if its plugin is installed (PlanSys2/plansys2_tfd_plan_solver, not in this repo)
    # TFD:
    #   plugin: "plansys2/TFDPlanSolver"
# executor: the BT builder is the launch argument bt_builder_plugin (STNBTBuilder by default,
# or SimpleBTBuilder). Set here, it would win over the argument
#
# executor:
#   ros__parameters:
#     bt_builder_plugin: "SimpleBTBuilder"
