name: kilted-devel

on:
  pull_request:
    branches:
      - kilted-devel
  push:
    branches:
      - kilted-devel
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # action-ros-ci 0.4 dropped colcon-mixin-name: the mixin goes in the defaults
      COLCON_DEFAULTS: |
        {
          "build": {
            "mixin": ["coverage-gcc"]
          },
          "lcov-result": {
            "lcov-config-file": "/tmp/plansys2_lcovrc",
            "filter": ["*/build/*", "*/test/*", "*/plansys2_tests/*"]
          },
          "test": {
            "parallel-workers" : 1
          }
        }
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-noble-ros-kilted-ros-base:master
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          ref: kilted-devel
      # The image can be older than the packages rosdep installs: upgrade it first so
      # all ROS packages come from the same sync (otherwise e.g. test_msgs fails to load)
      - name: Upgrade image and install popf deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          apt-get install -y libfl-dev
      # colcon lcov-result gives lcov its own configuration in every step, merging the
      # package reports included: lcov 2 rejects some of them for gcc line mismatches
      - name: lcov configuration
        run: |
          cat > /tmp/plansys2_lcovrc << 'EOF'
          geninfo_auto_base = 1
          geninfo_external = 0
          genhtml_num_spaces = 2
          genhtml_legend = 1
          function_coverage = 1
          # Lines, not branches: gcc adds exception branches to almost every call, never taken,
          # and Codecov counts every line with one of them as not covered
          branch_coverage = 0
          lcov_quiet = 1
          lcov_follow = 1
          ignore_errors = inconsistent,corrupt,empty,gcov,missing,mismatch,negative
          EOF
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: plansys2_bringup plansys2_bt_actions plansys2_core plansys2_domain_expert plansys2_executor plansys2_lifecycle_manager plansys2_msgs plansys2_pddl_parser plansys2_planner plansys2_popf_plan_solver plansys2_problem_expert plansys2_support_py plansys2_terminal plansys2_tests plansys2_tools
          # The branch to build: without it, action-ros-ci builds the ref that started the run
          ref: kilted-devel
          target-ros2-distro: kilted
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependency_repos.repos
          colcon-defaults: ${{ env.COLCON_DEFAULTS }}
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          files: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only the merged report: searching picks up tests and dependencies
          disable_search: true
          fail_ci_if_error: false
