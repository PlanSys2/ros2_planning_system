name: lyrical-devel

on:
  pull_request:
    branches:
      - lyrical-devel
  push:
    branches:
      - lyrical-devel
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-lyrical-ros-base:master
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          ref: lyrical-devel
      - name: Install popf deps
        run: apt-get update && apt-get install -y libfl-dev
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: plansys2_bringup plansys2_bt_actions plansys2_core plansys2_domain_expert plansys2_executor plansys2_lifecycle_manager plansys2_msgs plansys2_pddl_parser plansys2_planner plansys2_popf_plan_solver plansys2_problem_expert plansys2_support_py plansys2_terminal plansys2_tests plansys2_tools plansys2_tui_cli
          target-ros2-distro: lyrical
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependency_repos.repos
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          file: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          # yml: ./codecov.yml
          fail_ci_if_error: false
