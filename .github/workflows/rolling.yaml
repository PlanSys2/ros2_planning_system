name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    # Coverage doubles the time (instrumented build and tests, and lcov): pull requests are
    # built without it, pushes to rolling and the weekly run measure it for Codecov
    env:
      # Some tests measure times: with a loaded CPU, a failed test runs once more
      COLCON_DEFAULTS_PR: |
        {
          "test": {
            "parallel-workers" : 2,
            "ctest-args": ["-j4", "--repeat", "until-pass:2"]
          }
        }
      COLCON_DEFAULTS_COVERAGE: |
        {
          "build": {
            "mixin": ["coverage-gcc"]
          },
          "lcov-result": {
            "lcov-config-file": "/tmp/plansys2_lcovrc",
            "filter": ["*/build/*", "*/test/*", "*/plansys2_tests/*"]
          },
          "test": {
            "parallel-workers" : 2,
            "ctest-args": ["-j4", "--repeat", "until-pass:2"]
          }
        }
      COLCON_FEATURE_FLAGS: drop_test_deps
      CCACHE_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'coverage' }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      PACKAGES: plansys2_bringup plansys2_bt_actions plansys2_core plansys2_domain_expert plansys2_executor plansys2_kairos_plan_solver plansys2_klimax_plan_solver plansys2_lifecycle_manager plansys2_msgs plansys2_pddl_parser plansys2_planner plansys2_popf_plan_solver plansys2_problem_expert plansys2_state_updater plansys2_support_py plansys2_terminal plansys2_tests plansys2_tools plansys2_tui_cli
      ROS_VERSION: 2
      ROS_PYTHON_VERSION: 3
      DEBIAN_FRONTEND: noninteractive
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-rolling-ros-base:master
    defaults:
      run:
        shell: bash
    steps:
      # The ref under test, as action-ros-ci took it, but in a fixed path: ccache finds the same
      # paths in every run. A pull request brings its own dependency_repos.repos
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ros_ws/src/ros2_planning_system
      # The image can be older than the packages rosdep installs: upgrade it first so
      # all ROS packages come from the same sync (otherwise e.g. test_msgs fails to load)
      - name: Upgrade image and install popf deps
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y libfl-dev ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-rolling-${{ env.CCACHE_MODE }}-${{ github.run_id }}
          restore-keys: ccache-rolling-${{ env.CCACHE_MODE }}-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      # colcon lcov-result gives lcov its own configuration in every step, merging the
      # package reports included: lcov 2 rejects some of them for gcc line mismatches
      - name: lcov configuration
        if: github.event_name != 'pull_request'
        run: |
          cat > /tmp/plansys2_lcovrc << 'EOF'
          geninfo_auto_base = 1
          geninfo_external = 0
          genhtml_num_spaces = 2
          genhtml_legend = 1
          function_coverage = 1
          # Lines, not branches: gcc adds exception branches to almost every call, never taken,
          # and Codecov counts every line with one of them as not covered
          branch_coverage = 0
          lcov_quiet = 1
          lcov_follow = 1
          ignore_errors = inconsistent,corrupt,empty,gcov,missing,mismatch,negative
          parallel = 0
          EOF
      - name: Dependencies
        working-directory: ros_ws
        run: |
          for _ in 1 2 3; do rosdep update --include-eol-distros && break; done
          vcs import --force --recursive src/ --input src/ros2_planning_system/dependency_repos.repos
          rosdep install -r --from-paths $(colcon list --paths-only --packages-up-to $PACKAGES) \
            --ignore-src --rosdistro rolling -y \
            --skip-keys "rti-connext-dds-5.3.1 rti-connext-dds-6.0.1 rti-connext-dds-7.3.0 rti-connext-dds-7.7.0"
      - name: colcon defaults
        env:
          DEFAULTS: ${{ github.event_name == 'pull_request' && env.COLCON_DEFAULTS_PR || env.COLCON_DEFAULTS_COVERAGE }}
        run: |
          printf '%s' "$DEFAULTS" > /tmp/colcon_defaults.yaml
          echo "COLCON_DEFAULTS_FILE=/tmp/colcon_defaults.yaml" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != pull_request ]; then
            colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
            colcon mixin update default
          fi
      - name: Build
        working-directory: ros_ws
        run: |
          source /opt/ros/rolling/setup.sh
          colcon build --packages-up-to $PACKAGES --event-handlers=console_cohesion+ --symlink-install
      - name: Test
        working-directory: ros_ws
        run: |
          source /opt/ros/rolling/setup.sh
          if [ "${{ github.event_name }}" != pull_request ]; then
            colcon lcov-result --initial || true
          fi
          colcon test --event-handlers=console_direct+ --packages-select $PACKAGES
          colcon test-result --all || true
          colcon test-result --verbose
      - name: Coverage
        working-directory: ros_ws
        run: |
          source /opt/ros/rolling/setup.sh
          if [ "${{ github.event_name }}" != pull_request ]; then
            colcon lcov-result --packages-select $PACKAGES --verbose || true
          fi
          colcon coveragepy-result --packages-select $PACKAGES --verbose --coverage-report-args " -m"
      - name: ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-rolling-${{ env.CCACHE_MODE }}-${{ github.run_id }}
      - name: Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5.4.0
        with:
          files: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only the merged report: searching picks up tests and dependencies
          disable_search: true
          fail_ci_if_error: false
